[pytest]
# pytest配置文件

# 测试目录
testpaths = tests

# 测试文件模式
python_files = test_*.py *_test.py

# 测试类模式
python_classes = Test*

# 测试函数模式
python_functions = test_*

# 最小Python版本
minversion = 7.0

# 命令行选项
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=src/dingtalk_downloader
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    browser: 浏览器相关测试
    network: 网络相关测试
    file: 文件相关测试
    cookie: Cookie相关测试
    m3u8: M3U8相关测试
    downloader: 下载器相关测试
    binary: 二进制工具相关测试
    settings: 设置相关测试
    main: 主程序相关测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率配置
[coverage:run]
source = src/dingtalk_downloader
omit = 
    */tests/*
    */__pycache__/*
    */site-packages/*
    */venv/*
    */env/*
    */.venv/*
    */.env/*
    setup.py
    */migrations/*
    */settings.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    class .*\bProtocol\):
    @typing.overload
    if 0:
    if False:
    assert False
    pass
    raise NotImplementedError

[coverage:html]
directory = htmlcov
