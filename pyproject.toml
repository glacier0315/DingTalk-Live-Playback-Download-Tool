[build-system]
requires = ["hatchling>=1.30"]
build-backend = "hatchling.build"

[project]
name = "dingtalk-downloader"
version = "1.5.0"
description = "钉钉直播回放视频下载工具：通过 Selenium 抓取 Cookie、解析 m3u8 并调用 N_m3u8DL-RE 下载"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "项目团队" },
]
keywords = ["dingtalk", "live", "m3u8", "download", "selenium"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "selenium>=4.40.0",
    "pandas>=3.0.0",
    "openpyxl>=3.1.5",
    "PyYAML>=6.0.3",
]

[project.scripts]
dingtalk-downloader = "dingtalk_downloader.main:main"

[project.urls]
Repository = "https://github.com/opal1237/silt5339/DingTalk-Live-Playback-Download-Tool"

# PEP 735 依赖分组（uv 原生支持）
[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
]

# hatchling 构建配置（src-layout）
[tool.hatch.build.targets.wheel]
packages = ["src/dingtalk_downloader"]

[tool.hatch.build.targets.sdist]
include = [
    "src/dingtalk_downloader",
    "README.md",
    "requirements.txt",
    "assets",
]

# pytest 配置（从 pytest.ini 迁入）
[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/dingtalk_downloader",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-branch",
]
markers = [
    "integration: requires real browser + N_m3u8DL-RE.exe (skipped by default)",
]

# coverage 配置
[tool.coverage.run]
branch = true
source = ["dingtalk_downloader"]
omit = [
    "src/dingtalk_downloader/__init__.py",
    "src/dingtalk_downloader/main.py",
    "src/dingtalk_downloader/browser/*Driver.py",
    "src/dingtalk_downloader/config/logger_config.py",
]
include = ["src/dingtalk_downloader/**/*.py"]

[tool.coverage.report]
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "pass",
]
skip_empty = true
sort = "-Cover"
show_missing = true

[tool.coverage.paths]
source = ["src/dingtalk_downloader"]
