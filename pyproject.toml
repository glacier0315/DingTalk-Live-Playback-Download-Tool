[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dingtalk-downloader"
version = "1.3.0"
description = "钉钉直播回放视频下载工具：通过 Selenium 抓取 Cookie、解析 m3u8 并调用 N_m3u8DL-RE 下载"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "项目团队" },
]
keywords = ["dingtalk", "live", "m3u8", "download", "selenium"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "selenium>=4.6.0",
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
dingtalk-downloader = "dingtalk_downloader.main:main"

[project.urls]
Repository = "https://github.com/opal1237/silt5339/DingTalk-Live-Playback-Download-Tool"

# PEP 735 依赖分组（uv 原生支持）
[dependency-groups]
dev = [
    "pytest>=8.0",
]

# hatchling 构建配置（src-layout）
[tool.hatch.build.targets.wheel]
packages = ["src/dingtalk_downloader"]

[tool.hatch.build.targets.sdist]
include = [
    "src/dingtalk_downloader",
    "README.md",
    "requirements.txt",
    "assets",
]

# pytest 配置（从 pytest.ini 迁入）
[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: requires real browser + N_m3u8DL-RE.exe (skipped by default)",
]
