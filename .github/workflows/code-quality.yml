name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install radon xenon

    - name: Run Black
      run: |
        black --check --diff --color src/ tests/

    - name: Run Flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Run MyPy
      run: |
        mypy src/ --ignore-missing-imports --no-error-summary || true

    - name: Calculate Cyclomatic Complexity
      run: |
        echo "Cyclomatic Complexity Analysis:"
        radon cc src/ -a -s

    - name: Calculate Maintainability Index
      run: |
        echo "Maintainability Index:"
        radon mi src/ -s

    - name: Calculate Raw Metrics
      run: |
        echo "Raw Metrics (LOC, LLOC, SLOC, Comments, Multi):"
        radon raw src/ -s

    - name: Check Code Halstead Metrics
      run: |
        echo "Halstead Metrics:"
        radon hal src/ -s || true

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pydocstyle
        pip install -r requirements.txt

    - name: Run pydocstyle
      run: |
        pydocstyle src/ --count || true

    - name: Check README exists
      run: |
        test -f README.md && echo "README.md exists" || echo "README.md missing"

    - name: Check CHANGELOG exists
      run: |
        test -f CHANGELOG.md && echo "CHANGELOG.md exists" || echo "CHANGELOG.md missing (optional)"

  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety pip-audit
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Safety Check
      run: |
        safety check --full-report || true

    - name: Run pip-audit
      run: |
        pip-audit || true

    - name: Check for outdated packages
      run: |
        pip list --outdated || true
