# ========================================
# 钉钉直播回放下载工具 - 配置文件
# ========================================
# 说明：
#   1. 本文件用于配置钉钉直播回放下载工具的各项参数
#   2. 配置文件位置：./config/app.yaml (项目根目录下的config目录)
#   3. 修改配置后重启程序生效
#   4. 注释以#开头
# ========================================

# ========================================
# 应用配置
# ========================================
app:
  # 应用名称
  name: "钉钉直播回放下载工具"
  # 应用版本
  version: "1.5.0"
  # 构建日期
  build_date: "2026年01月15日"

# ========================================
# 下载配置
# ========================================
download:
  # 默认下载目录（相对于项目根目录）
  # 说明：当保存模式为默认时，视频将保存到此目录
  default_dir: "Downloads"

  # m3u8临时文件目录
  # 说明：m3u8文件下载过程中的临时存储目录
  # 支持绝对路径和相对路径（相对于项目根目录）
  temp_dir: "temp"

  # 最大重试次数
  # 说明：获取m3u8链接失败时的最大重试次数
  max_retry_count: 5

# ========================================
# 浏览器配置
# ========================================
browser:
  # 默认浏览器类型
  # 可选值：edge, chrome, firefox
  default_type: "edge"

  # 是否使用无头模式
  # 说明：无头模式下浏览器不显示界面
  headless: false

  # 页面加载超时时间（秒）
  # 说明：等待页面加载完成的最大时间
  timeout: 30

# ========================================
# 日志配置
# ========================================
logging:
  # 日志级别
  # 可选值：DEBUG, INFO, WARNING, ERROR, CRITICAL
  # 说明：DEBUG显示所有日志，CRITICAL只显示严重错误
  level: "INFO"

  # 日志目录
  # 说明：日志文件保存目录
  dir: "logs"

  # 单个日志文件最大大小（字节）
  # 说明：超过此大小会自动创建新文件
  # 10485760 = 10MB
  max_bytes: 10485760

  # 保留的日志文件数量
  # 说明：超过此数量的旧日志文件会被删除
  backup_count: 5

  # 日志保留天数
  # 说明：超过此天数的日志文件会被清理
  retention_days: 30

# ========================================
# 请求头配置
# ========================================
headers:
  # User-Agent
  # 说明：标识客户端类型和版本
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

  # Referer
  # 说明：表示请求的来源页面
  referer: "https://n.dingtalk.com/"

  # Accept
  # 说明：指定客户端能够接收的内容类型
  accept: "application/vnd.apple.mpegurl, text/plain, */*"

  # Accept-Language
  # 说明：指定客户端偏好的语言
  accept_language: "zh-CN,zh;q=0.9,en;q=0.8"

  # Accept-Encoding
  # 说明：指定客户端支持的压缩算法
  accept_encoding: "gzip, deflate, br"

  # Connection
  # 说明：控制网络连接的行为
  connection: "keep-alive"

  # Sec-Fetch-Dest
  # 说明：表示请求的目的地
  sec_fetch_dest: "document"

  # Sec-Fetch-Mode
  # 说明：表示请求的模式
  sec_fetch_mode: "navigate"

  # Sec-Fetch-Site
  # 说明：表示请求的来源站点
  sec_fetch_site: "same-origin"

  # Sec-Fetch-User
  # 说明：表示请求是否由用户激活
  sec_fetch_user: "?1"

  # Upgrade-Insecure-Requests
  # 说明：表示客户端是否支持升级到HTTPS
  upgrade_insecure_requests: "1"

# ========================================
# N_m3u8DL-RE配置
# ========================================
n_m3u8dl_re:
  # 可执行文件路径
  # 说明：N_m3u8DL-RE工具的完整路径
  executable_path: "assets/bin/N_m3u8DL-RE.exe"

  # UI语言
  # 说明：N_m3u8DL-RE工具的界面语言
  ui_language: "zh-CN"

  # 临时文件目录
  # 说明：N_m3u8DL-RE工具下载过程中的临时文件存储目录
  temp_dir: "temp"

  # 日志文件目录
  # 说明：N_m3u8DL-RE工具的日志文件保存目录
  log_dir: "logs"

# ========================================
# FFmpeg配置
# ========================================
ffmpeg:
  # 可执行文件路径
  # 说明：FFmpeg工具的完整路径
  executable_path: "assets/bin/ffmpeg.exe"
